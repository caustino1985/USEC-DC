    <script>
      // In AI Studio iframe environment, HMR WebSocket connections to non-proxied ports are disabled.
      // Intercept vite-hmr WebSocket instances to cleanly report OPEN state and avoid "WebSocket closed without opened" errors.
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')))) {
              var listeners = {};
              return {
                readyState: 1, // OPEN
                OPEN: 1,
                CLOSED: 3,
                CONNECTING: 0,
                CLOSING: 2,
                url: url,
                protocol: 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() { fn({ type: 'open' }); }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.OPEN = RealWebSocket.OPEN || 1;
          window.WebSocket.CLOSED = RealWebSocket.CLOSED || 3;
          window.WebSocket.CONNECTING = RealWebSocket.CONNECTING || 0;
          window.WebSocket.CLOSING = RealWebSocket.CLOSING || 2;
        }
      })();

      // Global safety handlers for unhandled rejections
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event.reason?.message || String(event.reason || '');
        if (
          msg.includes('WebSocket') ||
          msg.includes('closed without opened') ||
          msg.includes('Failed to log workspace activity')
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('closed without opened') ||
          msg.includes('Failed to log workspace activity')
        ) {
          event.preventDefault();
        }
      });
    </script>
